name: Update posts.json

'on':
  push:
    branches:
      - main
    paths:
      - "posts/**"
      - ".github/workflows/update-posts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Download post generator
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/codemefinn/carrd-blog-template/v1.0.0/scripts/generate-posts.py \
            -o /tmp/generate-posts.py

      - name: Generate posts.json
        run: python /tmp/generate-posts.py

      - name: Commit updated posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posts.json"
            git push
          else
            echo "posts.json is already up to date."
          fi
